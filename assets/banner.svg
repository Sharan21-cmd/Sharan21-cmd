<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Silicon Observatory banner for SHARAN K U</title>
  <desc id="desc">A technical banner showing a chip, signal traces, waveform, and identity block.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #07111E; }
      .surface { fill: #0D1B2A; stroke: #2B4258; stroke-width:1; }
      .secondary { fill: #102438; }
      .text-primary { fill: #F3F6FA; font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial; }
      .text-secondary { fill: #9CB1C6; }
      .signal { stroke: #83F0E0; stroke-width:2; fill:none; stroke-linejoin:round; }
      .amber { stroke: #E9B86B; fill:none; stroke-width:1.5; }
      .grid { stroke: rgba(255,255,255,0.03); stroke-width:1; }
      .chip { fill:#0D1B2A; stroke:#2B4258; stroke-width:2; rx:8; ry:8; }
    ]]></style>
    <symbol id="pin" viewBox="0 0 10 4">
      <rect x="0" y="1" width="10" height="2" fill="#83F0E0"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1200" height="390"/>

  <!-- Subtle engineering grid -->
  <g opacity="0.6">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" class="grid"/>
      </pattern>
    </defs>
    <rect x="0" y="0" width="1200" height="390" fill="url(#grid)"/>
  </g>

  <!-- Workbench surface -->
  <rect x="40" y="240" width="1120" height="110" class="surface" rx="6" ry="6"/>

  <!-- Chip -->
  <g transform="translate(120,80)">
    <rect class="chip" x="0" y="0" width="360" height="220" rx="12" ry="12"/>
    <!-- chip label -->
    <text x="24" y="36" font-size="20" class="text-primary" font-weight="700">Sharan K U</text>
    <text x="24" y="60" font-size="12" class="text-secondary">BMS Institute of Technology and Management</text>
    <text x="24" y="80" font-size="11" class="text-secondary">Design. Verify. Implement. Learn.</text>

    <!-- pins left -->
    <g transform="translate(-12,20)">
      <use href="#pin" x="0" y="0"/>
      <use href="#pin" x="0" y="12"/>
      <use href="#pin" x="0" y="24"/>
      <use href="#pin" x="0" y="36"/>
      <use href="#pin" x="0" y="48"/>
    </g>

    <!-- pins right -->
    <g transform="translate(362,20)">
      <use href="#pin" x="0" y="0"/>
      <use href="#pin" x="0" y="12"/>
      <use href="#pin" x="0" y="24"/>
      <use href="#pin" x="0" y="36"/>
      <use href="#pin" x="0" y="48"/>
    </g>

    <!-- simple floorplan lines -->
    <rect x="220" y="110" width="110" height="70" fill="#102438" stroke="#2B4258" stroke-width="1" rx="6"/>
    <text x="232" y="150" class="text-secondary" font-size="10">ALU</text>
    <rect x="40" y="110" width="140" height="70" fill="#102438" stroke="#2B4258" stroke-width="1" rx="6"/>
    <text x="60" y="150" class="text-secondary" font-size="10">CTRL</text>
  </g>

  <!-- Signal traces -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M 480 160 C 540 140, 640 140, 700 160" class="signal"/>
    <path d="M 480 200 C 540 220, 640 220, 700 200" class="amber"/>
    <!-- traces to workbench -->
    <path d="M 700 160 L 820 200" stroke="#83F0E0" stroke-width="2"/>
    <path d="M 700 200 L 820 260" stroke="#E9B86B" stroke-width="1.5"/>
  </g>

  <!-- Waveform block -->
  <g transform="translate(820,40)">
    <rect x="-8" y="-8" width="360" height="120" class="secondary" rx="6" ry="6" stroke="#2B4258"/>
    <text x="8" y="12" class="text-secondary" font-size="11">Clock / Req / Ack</text>

    <!-- clock -->
    <g transform="translate(8,28)">
      <polyline points="0,40 20,0 40,40 60,0 80,40 100,0 120,40" stroke="#83F0E0" stroke-width="2" fill="none"/>
      <text x="0" y="58" class="text-secondary" font-size="9">clk</text>
    </g>

    <!-- req -->
    <g transform="translate(8,88)">
      <polyline points="0,40 40,40 40,0 80,0 80,40 120,40" stroke="#E9B86B" stroke-width="2" fill="none"/>
      <text x="0" y="58" class="text-secondary" font-size="9">req</text>
    </g>

    <!-- ack -->
    <g transform="translate(8,148)">
      <polyline points="0,40 0,0 40,0 40,40 80,40 80,0 120,0" stroke="#9CB1C6" stroke-width="2" fill="none"/>
      <text x="0" y="58" class="text-secondary" font-size="9">ack</text>
    </g>
  </g>

  <!-- small annotations -->
  <g class="text-secondary" font-size="10">
    <text x="60" y="330">ASIC floorplan motif; traces show signal routing and timing relationships.</text>
    <text x="60" y="345">Colors: cyan = signals; amber = control; secondary = substrate.</text>
  </g>
</svg>
